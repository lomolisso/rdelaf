<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.title }}{% endblock %}</title>
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#282828" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#fbf1c7" media="(prefers-color-scheme: light)">
    <link rel="stylesheet" href="{{ get_url(path="main.css") }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="{{ get_url(path="js/theme.js") }}"></script>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="container">
        <nav class="navbar rough-edge">
            <div class="navbar-left">
                <a href="{{ config.base_url }}" class="nav-link {% if current_path == "/" %}active{% endif %}">Home</a>
                <a href="{{ get_url(path="cv") }}" class="nav-link {% if current_path == "/cv/" %}active{% endif %}">CV</a>
                <a href="{{ get_url(path="publications") }}" class="nav-link {% if current_path == "/publications/" %}active{% endif %}">Publications</a>
            </div>
            <div class="navbar-right">
                <button id="theme-toggle" class="theme-toggle">☀️</button>
            </div>
        </nav>

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer>
            <div class="container">
                <p>&copy; {{ now() | date(format="%Y") }} Raúl de la Fuente. All rights reserved.</p>
            </div>
        </footer>
    </div>
</body>
</html>
