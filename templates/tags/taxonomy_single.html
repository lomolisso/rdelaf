{% extends "base.html" %}
{% import "blog/_post_summary.html" as post_macros %}

{% block title %}#{{ term.name }} | {{ config.title }}{% endblock %}

{% block content %}
    <div class="blog-posts">
        {% for page in term.pages %}
            {{ post_macros::post_summary(page=page) }}
        {% endfor %}
    </div>
    
    <div class="back-link">
        <a href="{{ get_url(path="tags") }}">← View all tags</a>
    </div>
{% endblock %}
