{% extends "base.html" %}

{% block title %}Tags | {{ config.title }}{% endblock %}

{% block content %}
<br>
<p>Below is a list of all the tags in the blog.</p>
<ul class="tags-list">
    {% for tag in terms %}
        <li>
            <a href="{{ tag.permalink }}" class="tag">#{{ tag.name }}</a>
            <span class="count">({{ tag.pages | length }})</span>
        </li>
    {% endfor %}
</ul>
{% endblock %}
