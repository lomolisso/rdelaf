{% extends "base.html" %}

{% block title %}Tags | {{ config.title }}{% endblock %}

{% block content %}
<div class="taxonomy-list">
    <h1>All Tags</h1>
    <ul class="tags-list">
        {% for tag in terms %}
            <li>
                <a href="{{ tag.permalink }}" class="tag">#{{ tag.name }}</a>
                <span class="count">({{ tag.pages | length }})</span>
            </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
