{% extends "base.html" %}

{% block title %}{{ page.title }} | {{ config.title }}{% endblock %}

{% block body_class %}blog-page{% endblock %}

{% block extra_head %}
<!-- Add MathJax for LaTeX rendering -->
<script>
    MathJax = {
      svg: {
        fontCache: 'global'
      },
      tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']],
            processEscapes: true,
            packages: ['base', 'ams', 'noerrors', 'noundefined', 'autoload']
        },
        options: {
            skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
        },
        startup: {
            ready: function() {
                MathJax.startup.defaultReady();
            }
        }
    };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endblock %}

{% block content %}
<div class="terminal-section rough-edge">
    <div class="terminal-header">
        <span class="terminal-title">~/blog</span>
    </div>
    <div class="terminal-body">
        <p class="terminal-line">
            <span class="terminal-prompt">$</span> 
            <span class="terminal-command">cat {{ page.extra.filename }}</span>
        </p>
        
        <div class="terminal-output">
            <div class="post-content markdown-content">
                {{ page.content | safe }}
            </div>
            
            <footer class="post-footer">
                <a href="{{ get_url(path="blog", trailing_slash=true) }}" class="back-to-blog">← Back to Blog</a>
            </footer>
        </div>
    </div>
</div>
{% endblock %}
